<!doctype html>
<html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>人员库 · 组织层级 V1</title>
<style>
:root{--blue:#3482ff;--ink:#191b20;--muted:#858991;--bg:#f5f5f5}*{box-sizing:border-box}body{margin:0;background:#e9edf2;color:var(--ink);font:14px 'MiSans','Microsoft YaHei UI','Microsoft YaHei',sans-serif;-webkit-font-smoothing:antialiased}button,input{font:inherit}button{cursor:pointer;color:inherit;border:0;background:none}button:focus-visible,input:focus-visible{outline:3px solid #3482ff;outline-offset:2px}svg{width:23px;height:23px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}.board{width:1370px;margin:auto;padding:50px 55px 30px}.mast{display:flex;justify-content:space-between;align-items:end;margin-bottom:36px}.eyebrow{font-size:11px;letter-spacing:3px;color:#718097}h1{font-size:36px;font-weight:600;letter-spacing:-1px;margin:12px 0}.mast p{font-size:13px;color:#728094;margin:0}.version{color:#8591a2;font-size:12px;line-height:1.9;text-align:right}.grid{display:grid;grid-template-columns:repeat(3,390px);gap:45px}.caption{display:flex;align-items:center;gap:12px;margin-bottom:14px;font-size:14px;color:#41516a}.caption em{font:12px Consolas;color:#8d9aac;font-style:normal}.phone{height:844px;width:390px;background:var(--bg);border:6px solid #fff;border-radius:42px;position:relative;overflow:hidden;box-shadow:0 15px 45px #20334d0b}.status{height:44px;display:flex;justify-content:space-between;align-items:center;padding:0 23px;font-size:12px;font-weight:600}.signal{display:flex;gap:6px;align-items:center}.signal svg{width:16px;height:16px}.camera{position:absolute;width:9px;height:9px;left:calc(50% - 4px);top:14px;background:#202329;border-radius:50%}.content{padding:15px 20px 110px}.top{display:flex;align-items:center;justify-content:space-between}h2{font-size:31px;font-weight:650;letter-spacing:-1px;margin:9px 0 20px}.icon{height:48px;min-width:48px;padding:12px;display:inline-flex;align-items:center;justify-content:center;border-radius:50%}.top .icon{margin-top:-10px;margin-right:-12px;color:#727b89}.search{display:flex;align-items:center;gap:9px;background:#e9eaec;border-radius:16px;height:47px;padding:0 13px;color:#959ba5}.search svg{width:19px;height:19px}.search input{border:0;background:none;outline:none;width:100%;font-size:12px;color:#424c5c}.breadcrumb{display:flex;align-items:center;gap:2px;height:61px;white-space:nowrap}.breadcrumb button{font-size:12px;padding:12px 5px;color:#758399}.breadcrumb button:first-child{padding-left:0}.breadcrumb button.current{color:#2878ee;font-weight:550}.breadcrumb svg{width:13px;height:13px;color:#b2b9c3}.summary{display:flex;align-items:center;justify-content:space-between;color:#89919e;font-size:11px;margin:0 4px 11px;height:22px}.summary strong{font-weight:500;color:#576579;font-size:12px}.list{background:white;border-radius:24px;padding:0 16px;overflow:hidden}.folder,.person{width:100%;min-height:77px;display:flex;align-items:center;gap:12px;text-align:left;padding:13px 0}.folder+.folder,.person+.person{border-top:1px solid #f0f1f4}.foldericon{width:43px;height:43px;display:flex;align-items:center;justify-content:center;color:#dfac4e;flex-shrink:0}.foldericon svg{height:38px;width:38px;stroke:#dda442;fill:#ffda86;stroke-width:1.15}.rowtext{min-width:0;flex:1}.name{font-size:14px;font-weight:550;line-height:1.6}.meta{font-size:11px;color:#929aa7;margin-top:3px}.chevron{width:16px;height:16px;color:#b3bac4}.count{font:12px 'Microsoft YaHei UI';color:#8c96a5;margin-left:auto}.divider-label{font-size:11px;color:#8b94a1;margin:24px 5px 10px;display:flex;justify-content:space-between}.avatar{width:43px;height:43px;border-radius:16px;display:flex;align-items:center;justify-content:center;background:#eaf2ff;color:#5389d7;font-size:17px;flex-shrink:0}.person:nth-child(3n+2) .avatar{background:#eaf5f1;color:#58a18b}.person:nth-child(3n) .avatar{background:#f0edfa;color:#947bc6}.person .name span{font-size:10px;font-weight:400;margin-left:9px;color:#8b95a3}.number{font-size:11px;color:#7c8798;margin-top:5px;letter-spacing:.3px}.nav{position:absolute;bottom:27px;left:20px;right:20px;height:64px;border-radius:36px;display:flex;align-items:center;padding:5px;background:linear-gradient(135deg,#fffC,#ffffff80);border:1px solid #fff;box-shadow:0 8px 24px #59657916,inset 0 1px 1px white;backdrop-filter:blur(18px)}.nav button{height:52px;flex:1;display:flex;align-items:center;justify-content:center;color:#8d97a7;border-radius:29px}.nav button.active{background:#fff9;color:var(--blue);box-shadow:0 2px 9px #5e7a9710}.gesture{position:absolute;bottom:8px;left:calc(50% - 54px);width:108px;height:4px;border-radius:4px;background:#202329}.boardfooter{display:flex;gap:32px;margin-top:30px;padding-top:21px;border-top:1px solid #d3dbe5;font-size:12px;color:#718096;line-height:1.9}.boardfooter b{color:#43536c;font-weight:500}.boardfooter>div{flex:1}.empty{text-align:center;color:#8591a2;padding:44px 0}.note{font-size:11px;color:#929eaf;margin-top:18px}.drawer{position:absolute;inset:0;background:#0003;z-index:5;display:flex;align-items:end}.sheet{background:#fff;width:100%;padding:23px 25px 44px;border-radius:28px 28px 0 0}.sheet h3{font-size:24px;margin:10px 0}.sheet p{color:#788598;font-size:13px;line-height:1.8}.sheet header{display:flex;align-items:center;justify-content:space-between}.hidden{display:none}@media(max-width:900px){.board{width:100%;padding:28px 18px}.grid{grid-template-columns:390px;justify-content:center;gap:30px}.mast{display:block}.version{display:none}.boardfooter{display:block}.mast h1{font-size:28px}}@media(max-width:425px){.grid{grid-template-columns:1fr}.phone{width:100%}.caption{margin-top:15px}}
.content{height:calc(100% - 44px);overflow-y:auto;scrollbar-width:none}.content::-webkit-scrollbar{display:none}</style>
<svg style="display:none"><defs>
<symbol id="folder" viewBox="0 0 40 40"><path d="M4 12a3 3 0 0 1 3-3h9l4 4h13a3 3 0 0 1 3 3v15a3 3 0 0 1-3 3H7a3 3 0 0 1-3-3Z"/><path d="M4 16h32" stroke="#efba59"/></symbol>
<symbol id="search" viewBox="0 0 24 24"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/></symbol>
<symbol id="chevron" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></symbol>
<symbol id="back" viewBox="0 0 24 24"><path d="m14 5-7 7 7 7"/></symbol>
<symbol id="home" viewBox="0 0 24 24"><path d="m3 10 9-7 9 7v10H3Z"/><path d="M9 20v-7h6v7"/></symbol>
<symbol id="people" viewBox="0 0 24 24"><circle cx="9" cy="8" r="3.5"/><path d="M2 21v-3a7 7 0 0 1 14 0v3M17 5a3.5 3.5 0 0 1 0 7m2 3a6 6 0 0 1 3 5"/></symbol>
<symbol id="database" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 4 16 4 16 0V5M4 12c0 4 16 4 16 0"/></symbol>
<symbol id="settings" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/><circle cx="9" cy="6" r="2" fill="currentColor"/><circle cx="16" cy="12" r="2" fill="currentColor"/><circle cx="8" cy="18" r="2" fill="currentColor"/></symbol>
<symbol id="battery" viewBox="0 0 24 24"><rect x="2" y="6" width="18" height="12" rx="3"/><path d="M23 10v4M5 9h12v6H5Z" fill="currentColor" stroke="none"/></symbol>
<symbol id="signal" viewBox="0 0 24 24"><path d="M3 19v-3m5 3v-6m5 6V9m5 10V5" stroke-width="3"/></symbol>
<symbol id="close" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18"/></symbol>
</defs></svg>
<main class="board"><header class="mast"><div><div class="eyebrow">来电知人 / DIRECTORY</div><h1>像浏览文件夹一样，找到人。</h1><p>人员库 · 按组织逐级浏览</p></div><div class="version">设计提案 01<br>2026.11.08 · 示例数据</div></header><div class="grid" id="grid"></div><footer class="boardfooter"><div><b>01 / 一层一页</b><br>文件夹在前，直属人员在后。点击进入，返回保留浏览位置。</div><div><b>02 / 路径可回跳</b><br>面包屑定位当前组织；姓名、岗位和号码保留在人员行。</div><div><b>03 / 搜索跨层级</b><br>输入关键词搜索整个库；结果显示组织路径，清空返回原层级。</div></footer><div class="note">离线交互设计稿，可点击文件夹、面包屑与人员。尚未修改 Android 页面；性能需在原生实现后验证。</div></main>
<script>
const icon=(id,cls='')=>`<svg class="${cls}" aria-hidden="true"><use href="#${id}"/></svg>`;
const tree={root:{title:'全部单位',path:['root'],folders:[['company','星河科技有限公司','128 人'],['cloud','云杉信息有限公司','96 人'],['design','远山设计有限公司','64 人'],['other','未归属组织','3 人']],people:[]},company:{title:'星河科技',path:['root','company'],folders:[['rd','研发中心','76 人'],['product','产品中心','24 人'],['hr','人力资源部','12 人'],['ops','运营部','14 人']],people:[['林知远','总经理','138 0000 0001'],['陈亦宁','行政助理','138 0000 0002']]},rd:{title:'研发中心',path:['root','company','rd'],folders:[['mobile','移动开发组','28 人'],['platform','平台开发组','32 人'],['qa','质量保障组','15 人']],people:[['周予安','技术总监','138 0000 0003']]},mobile:{title:'移动开发组',path:['root','company','rd','mobile'],folders:[],people:[['许清和','组长','138 0000 0004'],['沈星遥','Android 开发','138 0000 0005'],['顾南乔','Android 开发','138 0000 0006'],['江予白','iOS 开发','138 0000 0007'],['宋知夏','测试工程师','138 0000 0008'],['陆景行','前端开发','138 0000 0009']]}};
for(const [id,title] of [['cloud','云杉信息'],['design','远山设计'],['other','未归属组织'],['product','产品中心'],['hr','人力资源部'],['ops','运营部'],['platform','平台开发组'],['qa','质量保障组']])tree[id]={title,path:['root',...(['cloud','design','other'].includes(id)?[]:['company']),id],folders:[],people:[]};
const states=['root','company','mobile'];
document.querySelector('#grid').innerHTML=['01|单位目录','02|组织文件夹','03|部门人员'].map((label,i)=>`<section><div class="caption"><em>${label.split('|')[0]}</em>${label.split('|')[1]}</div><article class="phone" id="screen-${i}"><div class="status"><span>9:41</span><span class="signal">${icon('signal')}${icon('battery')}</span></div><div class="camera"></div><div class="content"><div class="top"><h2>人员库</h2><button class="icon up" aria-label="返回上一级" title="返回上一级">${icon('back')}</button></div><label class="search">${icon('search')}<input aria-label="搜索全库" placeholder="搜索全库姓名、号码、组织"></label><div class="breadcrumb"></div><div class="body"></div></div><nav class="nav" aria-label="主导航">${['home','people','database','settings'].map((id,n)=>`<button class="${n===1?'active':''}" aria-label="${['首页','人员库','同步','设置'][n]}" ${n===1?'aria-current="page"':''}>${icon(id)}</button>`).join('')}</nav><div class="gesture"></div><div class="drawer hidden"><div class="sheet"></div></div></article></section>`).join('');
const personRow=(p,meta='')=>`<button class="person" data-person="${p[0]}" aria-label="查看${p[0]}详情"><span class="avatar">${p[0][0]}</span><span class="rowtext"><div class="name">${p[0]}<span>${p[1]}</span></div><div class="number">${meta||p[2]}</div></span>${icon('chevron','chevron')}</button>`;
function render(i){const screen=document.querySelector('#screen-'+i),s=tree[states[i]],q=screen.querySelector('input').value.trim();screen.querySelector('.up').style.visibility=states[i]==='root'?'hidden':'visible';const path=s.path.length>3?s.path.slice(-3):s.path;screen.querySelector('.breadcrumb').innerHTML=path.map((id,n)=>`${n?icon('chevron'):''}<button data-go="${id}" class="${id===states[i]?'current':''}">${id==='root'?'全部单位':tree[id].title}</button>`).join('');let html='';if(q){const matches=Object.values(tree).flatMap(o=>o.people.map(p=>({p,o}))).filter(({p,o})=>[...p,o.title].join(' ').includes(q));html=`<div class="summary"><strong>全库搜索</strong><span>${matches.length} 个结果</span></div><div class="list">${matches.map(({p,o})=>personRow(p,`${o.path.slice(1).map(id=>tree[id].title).join(' / ')} · ${p[2]}`)).join('')||'<div class="empty">未找到相关人员</div>'}</div>`}else{html=`<div class="summary"><strong>${states[i]==='root'?'组织':s.title}</strong><span>${s.folders.length?s.folders.length+' 个'+(states[i]==='root'?'单位':'部门'):s.people.length+' 人'}</span></div>`;if(s.folders.length)html+=`<div class="list">${s.folders.map(([id,name,count])=>`<button class="folder" data-go="${id}" aria-label="打开${name}"><span class="foldericon">${icon('folder')}</span><span class="rowtext"><span class="name">${name}</span></span><span class="count">${count}</span>${icon('chevron','chevron')}</button>`).join('')}</div>`;if(s.people.length){if(s.folders.length)html+=`<div class="divider-label"><span>直属人员</span><span>${s.people.length} 人</span></div>`;html+=`<div class="list">${s.people.map(p=>personRow(p)).join('')}</div>`}if(!s.folders.length&&!s.people.length)html+='<div class="list"><div class="empty">暂无直属人员</div></div>'}screen.querySelector('.body').innerHTML=html;screen.querySelectorAll('[data-go]').forEach(b=>b.onclick=()=>{states[i]=b.dataset.go;screen.querySelector('input').value='';render(i)});screen.querySelectorAll('[data-person]').forEach(b=>b.onclick=()=>{const p=Object.values(tree).flatMap(o=>o.people).find(p=>p[0]===b.dataset.person);const drawer=screen.querySelector('.drawer');drawer.querySelector('.sheet').innerHTML=`<header><h3>${p[0]}</h3><button class="icon" aria-label="关闭详情">${icon('close')}</button></header><p>${p[1]}</p><p>${p[2]}</p><p>${s.path.slice(1).map(id=>tree[id].title).join(' / ')}</p>`;drawer.classList.remove('hidden');drawer.querySelector('button').onclick=()=>drawer.classList.add('hidden')});}
states.forEach((_,i)=>{const screen=document.querySelector('#screen-'+i);screen.querySelector('input').oninput=()=>render(i);screen.querySelector('.up').onclick=()=>{const path=tree[states[i]].path;states[i]=path[path.length-2]||'root';render(i)};render(i)});
</script></html>
