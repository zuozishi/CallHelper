name: 发布正式版 APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: 检查、签名并发布
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: write
    defaults:
      run:
        shell: bash

    steps:
      - name: 检出 tag 对应源码
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: 校验 tag 与打包工具测试
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os
          import re
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from build_release import validate_release_tag
          source = Path('app/build.gradle.kts').read_text(encoding='utf-8')
          versions = re.findall(r'^\s*versionName\s*=\s*"([^"]+)"', source, re.MULTILINE)
          if len(versions) != 1:
              raise SystemExit('Expected one literal versionName')
          validate_release_tag(os.environ['RELEASE_TAG'], versions[0])
          PY
          python3 -m unittest discover -s scripts -p 'test_*.py'
          python3 scripts/release_notes.py --tag "$RELEASE_TAG" --output artifacts/release-notes.md

      - name: 安装 JDK 21
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: 安装 Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools platforms;android-37.0 build-tools;36.1.0'
          log-accepted-android-sdk-licenses: false

      - name: 从 GitHub Secrets 恢复签名配置
        env:
          RELEASE_KEYSTORE_BASE64: ${{ secrets.RELEASE_KEYSTORE_BASE64 }}
          RELEASE_STORE_PASSWORD: ${{ secrets.RELEASE_STORE_PASSWORD }}
          RELEASE_KEY_ALIAS: ${{ secrets.RELEASE_KEY_ALIAS }}
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from release_signing import FIELDS, load_config
          values = {name: os.environ.get(name, '') for name in FIELDS}
          if any(not value or '\n' in value or '\r' in value for value in values.values()):
              raise SystemExit('Configure all four single-line RELEASE_* repository secrets')
          fd = os.open('.env', os.O_WRONLY | os.O_CREAT | os.O_EXCL, 0o600)
          with os.fdopen(fd, 'w', encoding='utf-8', newline='\n') as output:
              output.write(''.join(f'{name}={values[name]}\n' for name in sorted(FIELDS)))
          load_config(Path('.env'))
          PY

      - name: 构建、检查并签名 APK
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: python3 scripts/build_release.py --tag "$RELEASE_TAG"

      - name: 清理临时签名材料
        if: always()
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import shutil
          Path('.env').unlink(missing_ok=True)
          for directory in Path('artifacts/releases').glob('signing-*'):
              if directory.is_dir():
                  shutil.rmtree(directory)
          PY

      - name: 上传产物并发布 GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          apk="artifacts/releases/callhelper-${version}-release.apk"
          assets=("$apk" "${apk}.sha256" "${apk}.json")
          for asset in "${assets[@]}"; do
            test -s "$asset"
          done
          (cd artifacts/releases && sha256sum --check "callhelper-${version}-release.apk.sha256")
          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
          else
            gh release create "$RELEASE_TAG" "${assets[@]}" \
              --verify-tag --title "$RELEASE_TAG" --notes-file artifacts/release-notes.md --draft \
              --prerelease="$prerelease"
          fi
          gh release edit "$RELEASE_TAG" --notes-file artifacts/release-notes.md \
            --draft=false --prerelease="$prerelease"
